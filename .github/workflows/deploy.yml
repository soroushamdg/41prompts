name: Release

# No deploy logic here — Coolify deploys itself on push to main (staging) and on v* tags
# (production), per infra/README.md. This workflow only makes production deploys visible
# in one place by creating a GitHub Release from the tag.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
