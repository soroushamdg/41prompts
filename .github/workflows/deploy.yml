name: Release

# No deploy logic here — build-images.yml builds, pushes to GHCR, and triggers Coolify's deploy
# webhook on push to main (staging) and on v* tags (production); Coolify's own GitHub-App
# auto-deploy is off (see infra/README.md and docs/epics/EPIC-008-prebuilt-images.md). This
# workflow only makes production deploys visible in one place by creating a GitHub Release
# from the tag.
# Concurrency (2026-09-13). Grouped so two runs on the same ref queue rather than race, but
# **never cancelled**: this workflow ships something. A cancelled release is worse than a duplicated
# one, and it is duplicated only if somebody pushes the same tag twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
