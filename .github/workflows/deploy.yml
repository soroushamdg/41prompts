name: Release

# No deploy logic here — build-images.yml builds, pushes to GHCR, and triggers Coolify's deploy
# webhook on push to main (staging) and on v* tags (production); Coolify's own GitHub-App
# auto-deploy is off (see infra/README.md and docs/epics/EPIC-008-prebuilt-images.md). This
# workflow only makes production deploys visible in one place by creating a GitHub Release
# from the tag.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
