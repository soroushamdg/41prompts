name: Rollback

# Retags an already-built :sha-<sha> image to :staging or :production with imagetools (registry-side, no
# rebuild, no checkout) and fires the same Coolify deploy webhook build-images.yml uses. The sha must already
# exist as a :sha-<sha> tag on GHCR — i.e. a commit that previously built successfully via build-images.yml.
# See infra/RUNBOOK.md's "Roll back a deploy" section for the procedure and how it was timed.
# Concurrency (2026-09-13). Grouped so two runs on the same ref queue rather than race, but
# **never cancelled**: this workflow ships something. A cancelled release is worse than a duplicated
# one, and it is duplicated only if somebody pushes the same tag twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to roll back
        required: true
        type: choice
        options:
          - staging
          - production
      sha:
        description: Full commit sha to roll back to (must already exist as :sha-<sha> on GHCR)
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/soroushamdg/41prompts-web
  WORKER_IMAGE: ghcr.io/soroushamdg/41prompts-worker

jobs:
  rollback:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag web
        run: |
          docker buildx imagetools create \
            --tag "${WEB_IMAGE}:${{ inputs.environment }}" \
            "${WEB_IMAGE}:sha-${{ inputs.sha }}"

      - name: Retag worker
        run: |
          docker buildx imagetools create \
            --tag "${WORKER_IMAGE}:${{ inputs.environment }}" \
            "${WORKER_IMAGE}:sha-${{ inputs.sha }}"

      - name: Trigger Coolify deploy
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            uuid="${{ secrets.COOLIFY_PRODUCTION_UUID }}"
          else
            uuid="${{ secrets.COOLIFY_STAGING_UUID }}"
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_DEPLOY_TOKEN }}" \
            "${{ secrets.COOLIFY_URL }}/api/v1/deploy?uuid=${uuid}"
