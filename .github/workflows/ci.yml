name: CI

# Concurrency (2026-09-13, Actions budget second pass).
#
# A second push to a branch cancels the first run instead of paying for both. On a branch under
# review that is most of the waste: a run starts, a review comment arrives, a fixup lands, and two
# runs of the same suite are billed for one answer.
#
# **`main` and tags are excluded from cancellation, deliberately.** A run on `main` is the record
# that a merge was green, and a release build must never be cancelled by whatever lands next — the
# expression below is the whole of that guarantee, so read it before changing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

# Documentation-only changes do not run this workflow (2026-09-13, Actions budget second pass).
#
# **Why this is the line, and why it must not move.** `ci` runs lint, typecheck, migrations, the unit
# suites, Playwright and the Python tests — six to ten billed minutes that cannot tell a reader
# anything about a change to `docs/`. The rule is not *size*: a one-character change to a `.ts` file
# runs the whole suite, and a thousand lines of `docs/` does not. **Do not widen this into "skip CI on
# small changes."** The question is only ever whether the gate could have something to say.
#
# **Compliance is deliberately not filtered.** `reuse`, `license-gate`,
# `boundaries-and-forbidden-words` and `mirror-dry-run` all check things documentation *can* break —
# a `LICENSES/` edit, a README inside a public package, a forbidden word in UI copy. They are the
# cheap jobs; skipping them would save seconds and cost the one class of change they exist to catch.
#
# **`paths-ignore` rather than a changed-files gate, and this was measured rather than assumed.** A
# gate job is fail-safe and was built first, then thrown away: GitHub bills every job rounded up to a
# whole minute, so a fifteen-second gate costs a minute on every run it does *not* save. Over the
# hundred runs to 2026-09-13 it would have saved 19 minutes and cost 36. `paths-ignore` costs nothing
# because the workflow never starts. It is also fail-safe in the direction that matters: when GitHub
# cannot generate a diff — too many commits, too many files, a timeout — it runs the workflow.
#
# `**.md` and not `*.md`: `*` does not cross a `/`, so `*.md` would match only the repository root.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "LICENSES/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "LICENSES/**"
      - "**.md"

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: 41p
          POSTGRES_PASSWORD: 41p
          POSTGRES_DB: 41p
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U 41p -d 41p"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://41p:41p@localhost:5432/41p
      DEPLOY_ENV: development
      BETTER_AUTH_SECRET: ci-secret-not-for-prod-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      # Non-secret placeholders — never real credentials. Better Auth needs a clientId/Secret
      # pair to construct its Google/GitHub providers at startup, but nothing in this suite
      # drives an actual OAuth round trip (that's verified by hand against staging, see
      # docs/epics/EPIC-002-data-and-auth.md's acceptance criteria); the magic-link Playwright
      # tests read the verification token straight from the database instead.
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      GITHUB_CLIENT_ID: ci-github-client-id
      GITHUB_CLIENT_SECRET: ci-github-client-secret
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm db:migrate

      - run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm e2e

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v3

      - name: Python tests
        working-directory: sdks/python
        run: uv run pytest -q
