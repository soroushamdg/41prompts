name: Build images

# Builds web and worker, pushes both to private GHCR, then tells Coolify to pull and redeploy. Coolify never
# builds anything itself — see infra/docker-compose.staging.yml / infra/docker-compose.production.yml (image:
# only, no build:) and docs/epics/EPIC-008-prebuilt-images.md for why. Never runs on pull_request — ci.yml
# already lints/typechecks/tests those; this workflow's only job is producing and shipping images.
on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/soroushamdg/41prompts-web
  WORKER_IMAGE: ghcr.io/soroushamdg/41prompts-worker

jobs:
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          tags="${WEB_IMAGE}:sha-${{ github.sha }}"
          if [ "${{ github.ref_type }}" = "branch" ] && [ "${{ github.ref_name }}" = "main" ]; then
            tags="${tags},${WEB_IMAGE}:staging"
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tags="${tags},${WEB_IMAGE}:production,${WEB_IMAGE}:${{ github.ref_name }}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  build-worker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          tags="${WORKER_IMAGE}:sha-${{ github.sha }}"
          if [ "${{ github.ref_type }}" = "branch" ] && [ "${{ github.ref_name }}" = "main" ]; then
            tags="${tags},${WORKER_IMAGE}:staging"
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tags="${tags},${WORKER_IMAGE}:production,${WORKER_IMAGE}:${{ github.ref_name }}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  deploy:
    needs: [build-web, build-worker]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploy
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            uuid="${{ secrets.COOLIFY_PRODUCTION_UUID }}"
          else
            uuid="${{ secrets.COOLIFY_STAGING_UUID }}"
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_DEPLOY_TOKEN }}" \
            "${{ secrets.COOLIFY_URL }}/api/v1/deploy?uuid=${uuid}"
