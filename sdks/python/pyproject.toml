[project]
# TODO(EPIC-054): confirm this distribution name (and that "fortyone" is free on PyPI) before first publish.
name = "fortyone-prompts"
version = "0.0.1"
description = "Runtime resolve() for 41Prompts. Zero dependencies."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.urls]
# Deliberately the private repository and not `41prompts/41prompts`, which does not exist: an empty
# placeholder reads as abandoned to a stranger, a private one reads as unreleased. EPIC-056 creates
# the public mirror and re-points every one of these as part of that change, not before.
Homepage = "https://github.com/soroushamdg/41prompts/tree/main/sdks/python#readme"
Repository = "https://github.com/soroushamdg/41prompts"
Issues = "https://github.com/soroushamdg/41prompts/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fortyone"]

[dependency-groups]
dev = ["pytest"]
