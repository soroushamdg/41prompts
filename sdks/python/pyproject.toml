[project]
# TODO(EPIC-006): confirm this distribution name (and that "fortyone" is free on PyPI) before first
# publish. EPIC-054 built the runtime; registering the name needs an account only Soroush can open.
name = "fortyone-prompts"
version = "0.1.0"
description = "Runtime resolve() for 41Prompts. Zero dependencies."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
keywords = ["prompt", "llm", "prompt-management"]
# Deliberately empty and asserted to be, by `tests/test_packaging.py` through
# `importlib.metadata.requires`. The whole delivery path — HTTP, JSON, SHA-256, atomic writes,
# background refresh — is standard library, so a customer installing this installs one thing.
dependencies = []

[project.urls]
# Deliberately the private repository and not `41prompts/41prompts`, which does not exist: an empty
# placeholder reads as abandoned to a stranger, a private one reads as unreleased. EPIC-056 creates
# the public mirror and re-points every one of these as part of that change, not before.
Homepage = "https://github.com/41prompts/41prompts/tree/main/sdks/python#readme"
Repository = "https://github.com/41prompts/41prompts"
Issues = "https://github.com/41prompts/41prompts/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fortyone"]

[tool.mypy]
strict = true
python_version = "3.12"

[dependency-groups]
dev = ["pytest"]
