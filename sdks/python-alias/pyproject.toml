[project]
# The alias distribution. `pip install 41prompts` installs `fortyone-prompts` and nothing else; the
# import is still `fortyone`, which is what every generated `prompts.py` writes.
#
# **It ships no module of its own**, deliberately. A second copy of `fortyone/` under another
# distribution name would let a machine end up with two of them and no rule about which wins — the
# oldest packaging failure there is. So this is a name and a dependency, which is all an alias is.
#
# TODO(EPIC-006): neither name is registered. EPIC-056 turns on trusted publishing from the public
# repository; until then this is built and never published, exactly as `packages/cli-unscoped` is.
name = "41prompts"
version = "0.1.0"
description = "41Prompts for Python — an alias for fortyone-prompts. Import fortyone."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
keywords = ["prompt", "llm", "prompt-management"]
dependencies = ["fortyone-prompts==0.1.0"]

[project.urls]
Homepage = "https://github.com/soroushamdg/41prompts/tree/main/sdks/python-alias#readme"
Repository = "https://github.com/soroushamdg/41prompts"
Issues = "https://github.com/soroushamdg/41prompts/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Nothing to include but the metadata: `force-include` of an empty mapping is how hatchling is told
# that a distribution with no package directory is intended rather than misconfigured.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
include = ["README.md", "LICENSE", "NOTICE", "pyproject.toml"]
