# Coolify-deployed, staging environment. **This is the one file that describes how staging is built.**
#
# Coolify builds web and worker from this file on every push to main (EPIC-009, 2026-09-12). It used to pull
# prebuilt `:staging` images from GHCR, built by Actions on every merge — that cost 6.58 billed minutes a merge,
# 480 minutes across 73 merges, and helped exhaust a 2,000-minute monthly allowance in 8.4 days, which stopped
# every deploy. On the box the same build costs nothing and competes with nothing, because staging is not serving
# anybody. **Production is unchanged** and still pulls a prebuilt image from a `v*` tag, which is the reason
# EPIC-008 existed: a box serving production must never also be building it.
#
# `/healthz`'s `commit` still reports correctly under an on-box build, which was the thing worth checking before
# reverting: `apps/web/app/healthz/route.ts` prefers the baked `COMMIT_SHA` only when it is not the literal
# "unknown", and otherwise falls back to `SOURCE_COMMIT`, which Coolify sets directly on the running container at
# deploy time.
#
# ${POSTGRES_USER}/${POSTGRES_PASSWORD}/${POSTGRES_DB}/${DEPLOY_ENV} below are Coolify Environment Variables,
# entered by hand per infra/README.md step 9 — that's intentional; those four are meant to be Coolify-managed.
# **What must never appear here is ${SOURCE_COMMIT} or ${COMMIT_SHA} inside a build.args block.** That is the
# EPIC-001 F2 defect: any ${VAR} written in a build.args block becomes a permanently locked Coolify application
# variable that then overrides the real build arg on every future deploy, pinning it to the fallback for ever.
#
# There are `build:` blocks in this file again, so the mistake is reachable now in a way it was not while this
# file only pulled images. **The build blocks below carry no `args:` at all**, deliberately, and the commit
# reaches the container by Coolify's own `SOURCE_COMMIT` instead — see the note above. If a locked
# `SOURCE_COMMIT` variable already exists in the Coolify UI from before EPIC-008, it has to be deleted or it will
# win; infra/README.md step 10 has that cleanup.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    # Built on the box by Coolify. No `args:` here — see the EPIC-001 F2 note at the top of this file.
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DEPLOY_ENV: ${DEPLOY_ENV}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    # Mirrors the HEALTHCHECK baked into apps/web/Dockerfile, deliberately duplicated: Coolify reads the
    # compose file rather than the image, so without this it reports "Healthcheck: Not configured" while
    # Docker is in fact checking the container and reporting it healthy. Same test, same thresholds — if you
    # change one, change the other. No `${...}` anywhere in here, for the EPIC-001 F2 reason above.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    ports:
      - "127.0.0.1:3000:3000"

  worker:
    # Built on the box by Coolify. No `args:` here — see the EPIC-001 F2 note at the top of this file.
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DEPLOY_ENV: ${DEPLOY_ENV}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    # Mirrors apps/worker/Dockerfile's HEALTHCHECK, for the same reason as web's above. The worker serves no
    # HTTP, so liveness is "the entry file is still the running process", not a request.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'apps/worker/src/index.ts' || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Still built inline, not pulled from GHCR: this is a tiny wrapper around postgres:16 + awscli, not one of the
  # two images EPIC-008 moved to Actions (web/worker only, per docs/epics/CURRENT.md's scope). Identical to the
  # backup service in infra/docker-compose.yml.
  backup:
    build:
      context: .
      dockerfile_inline: |
        FROM postgres:16
        RUN apt-get update \
            && apt-get install -y --no-install-recommends awscli \
            && rm -rf /var/lib/apt/lists/*
        WORKDIR /app
        COPY infra/backup.sh infra/backup-loop.sh infra/restore.sh ./
        RUN chmod +x ./backup.sh ./backup-loop.sh ./restore.sh
        CMD ["./backup-loop.sh"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
