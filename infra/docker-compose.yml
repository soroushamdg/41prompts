# Local dev only (`pnpm dev` / `docker compose up`) — this is the one file here that still has build:.
# Coolify no longer deploys from this file; it deploys infra/docker-compose.staging.yml and
# infra/docker-compose.production.yml instead, which pull prebuilt images from GHCR (see
# .github/workflows/build-images.yml and docs/epics/EPIC-008-prebuilt-images.md).
#
# Run this file with the repo root as the project directory, e.g. from the repo root:
#   docker compose --project-directory . -f infra/docker-compose.yml <command>
# Without --project-directory, Compose resolves build.context, env_file, and its default
# .env lookup relative to THIS file's own directory (infra/), not the repo root, and the
# build/deploy breaks (missing .env, wrong build context). See infra/README.md step 8 for
# the equivalent setting in Coolify.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Bound to 127.0.0.1, not published to the internet: ufw only allows 22/80/443, but
    # Docker's port publishing bypasses ufw by writing straight to iptables. Loopback-only
    # keeps this reachable for local `psql`/dev use without opening it up publicly.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # No `args:` here on purpose: any `${VAR}` written anywhere in this file — including
      # inside `build.args` — gets parsed by Coolify into a permanently "locked" application
      # environment variable, defaulting to whatever the fallback in the `${...}` expression
      # was (here, the literal string "unknown"). Once that locked variable exists, Coolify
      # feeds its stored value back into the build as the `SOURCE_COMMIT`/`COMMIT_SHA` build
      # arg, permanently pinning it to "unknown" even after the fallback logic below is fixed
      # — see infra/README.md step 10 for the diagnosis and the one-time cleanup this needs
      # in the Coolify UI. For a local build with a real commit baked in, pass it on the CLI
      # instead of here: `docker compose ... build --build-arg SOURCE_COMMIT=$(git rev-parse HEAD) web`.
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides .env's localhost-hostname DATABASE_URL (for `pnpm dev` outside Docker)
      # with the in-network hostname, built from the same POSTGRES_* vars postgres uses.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    # Same loopback-only reasoning as postgres above. Coolify's proxy reaches this
    # container over the compose network by service name (web:3000), not via this
    # published port — it never needs to be open beyond 127.0.0.1.
    ports:
      - "127.0.0.1:3000:3000"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  # Nightly pg_dump -> R2, run as a small always-on scheduler rather than a Coolify
  # Scheduled Task: this way the whole backup story is infra-as-code, verifiable locally
  # with `docker compose config`/`up`, and doesn't depend on whatever the installed
  # Coolify version supports for scheduled tasks against a compose resource (unverifiable
  # without server access — see docs/epics/plan-EPIC-001.md §2). If a later epic finds
  # Coolify's own scheduler is a better fit, this service can be swapped for that without
  # touching infra/backup.sh or infra/restore.sh, which know nothing about the trigger.
  backup:
    build:
      context: .
      dockerfile_inline: |
        FROM postgres:16
        RUN apt-get update \
            && apt-get install -y --no-install-recommends awscli \
            && rm -rf /var/lib/apt/lists/*
        WORKDIR /app
        COPY infra/backup.sh infra/backup-loop.sh ./
        RUN chmod +x ./backup.sh ./backup-loop.sh
        CMD ["./backup-loop.sh"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
