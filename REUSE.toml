version = 1
SPDX-PackageName = "41prompts"
SPDX-PackageSupplier = "41Prompts Inc."
SPDX-PackageDownloadLocation = "https://github.com/41prompts/41prompts"

# CLAUDE.md's own rule: public packages (packages/core, packages/cli, packages/sdk-ts,
# sdks/python) carry a real SPDX header on every source file, checked in directly — that's
# already done and needs no annotation here. Everything else in the repo is proprietary
# (LicenseRef-41Prompts-Proprietary) and, per the same established convention (see
# docs/epics/reports/EPIC-003-report.md's "packages/ui gets no SPDX header comment at all,
# matching packages/db's existing convention"), is covered here in bulk rather than by adding a
# header comment to every config file, doc, and proprietary source file individually — many of
# these (JSON, SQL, .env.example, .gitignore, lockfiles) cannot carry a comment header at all.

# **These globs are load-bearing, not bookkeeping (2026-09-13).** `scripts/license-gate.mjs` fails the
# build if no annotation here covers `packages/ui`, `packages/db`, `packages/logger` or `apps/worker`.
# While the repository is public, this file and those four `LICENSE` files are the whole of what
# separates "you may use this" from "you may not". Narrowing a glob below is a licensing change.

# The `DCO` file is the Developer Certificate of Origin 1.1, reproduced verbatim. It is a licence
# document published by The Linux Foundation, it carries its own permission notice ("copy and
# distribute verbatim copies ... but changing it is not allowed"), and 41Prompts Inc. claims no
# copyright in it. It cannot carry an SPDX header without changing the text it forbids changing,
# which is exactly what an annotation here is for.
[[annotations]]
path = ["DCO"]
SPDX-FileCopyrightText = "2004, 2006 The Linux Foundation and its contributors"
SPDX-License-Identifier = "LicenseRef-DCO-1.1"

[[annotations]]
path = [
  ".dependency-cruiser.cjs",
  ".dockerignore",
  ".editorconfig",
  ".env.example",
  ".gitignore",
  ".nvmrc",
  ".prettierignore",
  ".prettierrc.json",
  "CLAUDE.md",
  "CONTRIBUTING.md",
  "README.md",
  "eslint.config.js",
  "package.json",
  "playwright.config.ts",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "tsconfig.base.json",
  "tsconfig.depcruise.json",
  "turbo.json",
  ".github/**",
  # EPIC-901, 2026-09-18: `.githooks/**` was covered by no glob at all. Its one file satisfied REUSE
  # with an `SPDX-License-Identifier: Apache-2.0` header of its own — a grant on a git hook that
  # does not ship in the public mirror and never was meant to. A tree with no annotation is
  # compliant only for as long as every file in it remembers to carry a header, which is the
  # arrangement this block exists to replace.
  ".githooks/**",
  "apps/**",
  "docs/**",
  "infra/**",
  "packages/db/**",
  "packages/logger/**",
  "packages/ui/**",
  "scripts/**",
]
SPDX-FileCopyrightText = "2026 41Prompts Inc."
SPDX-License-Identifier = "LicenseRef-41Prompts-Proprietary"

# The four public packages' own non-source files (package metadata, project config, the NOTICE
# REUSE itself requires a licence for) ship as part of the same public artifact as their `src`
# (or `fortyone`/`tests`) trees, which already carry real Apache-2.0 headers — these get the same
# licence, not the repo-wide proprietary default above, since they are the public package.
# `mirror/` is the public repository's own root, promoted to the top level by
# scripts/mirror-dry-run.sh's path rename. Its Markdown and YAML files carry real headers; these
# four cannot (JSON has no comments, and a LICENSE and a NOTICE ship verbatim).
[[annotations]]
path = [
  "mirror/LICENSE",
  "mirror/NOTICE",
  "mirror/package.json",
]
SPDX-FileCopyrightText = "2026 41Prompts Inc."
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
  "packages/cli/NOTICE",
  "packages/cli/README.md",
  "packages/cli/package.json",
  "packages/cli/tsconfig.json",
  "packages/cli/turbo.json",
  "packages/core/NOTICE",
  "packages/core/README.md",
  "packages/core/package.json",
  "packages/core/tsconfig.json",
  "packages/core/turbo.json",
  "packages/sdk-ts/NOTICE",
  "packages/sdk-ts/README.md",
  "packages/sdk-ts/package.json",
  "packages/sdk-ts/tsconfig.json",
  "packages/sdk-ts/turbo.json",
  "sdks/python/NOTICE",
  "sdks/python/README.md",
  "sdks/python/pyproject.toml",
  "sdks/python/uv.lock",
  "sdks/python/fortyone/py.typed",
  "sdks/python/tests/canonical_golden.json",
  "sdks/python/tests/cross-language/**",
  "sdks/python-alias/NOTICE",
  "sdks/python-alias/README.md",
  "sdks/python-alias/pyproject.toml",
]
SPDX-FileCopyrightText = "2026 41Prompts Inc."
SPDX-License-Identifier = "Apache-2.0"
